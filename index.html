<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>今晚流水记账</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",Arial,sans-serif}
.app{max-width:1100px;margin:auto;padding:12px}
.header{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px #00000010}
.title{font-size:22px;font-weight:700}
.clock{margin-top:5px;color:#1677ff;font-size:15px;font-weight:600}
.toolbar,.stats,.formrow,.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{margin-top:12px}
button{border:0;border-radius:9px;padding:9px 13px;background:#e9edf2;cursor:pointer;font-size:14px}
button.primary{background:#1677ff;color:#fff}
button.danger{background:#ff4d4f;color:#fff}
button.green{background:#20a464;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
input,select{border:1px solid #d9dee5;border-radius:9px;padding:10px;font-size:15px;background:#fff}
input{min-width:0}
.customer-input{flex:1}
.amount{width:150px}
.note{flex:1}
.type button.active{background:#1677ff;color:white}
.names{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.namebtn{background:#eef5ff;color:#1769d1}
.namebtn.selected{background:#1677ff;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#f7f8fa;border-radius:10px;padding:11px}
.stat b{display:block;font-size:19px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}
th{background:#fafafa}
.lend{color:#e5484d}.repay{color:#15945c}.income{color:#7b4fd6}
.empty{text-align:center;color:#999;padding:25px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:11px 3px;border-bottom:1px solid #eee}
.badge{font-size:12px;color:#666}
@media(max-width:650px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .amount{width:110px}
 table{font-size:13px}
 th:nth-child(5),td:nth-child(5){display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">今晚流水记账</div>
    <div id="clock" class="clock">系统时间加载中…</div>
    <div class="toolbar">
      <button id="newDay" class="primary">开始新一天</button>
      <button id="historyBtn">历史账单</button>
      <button id="currentBtn" disabled>当前账单</button>
    </div>
  </div>

  <div id="main">
    <div class="card">
      <div><b id="dateTitle"></b><span id="viewBadge" class="badge"></span></div>
      <div class="formrow" style="margin-top:10px">
        <input id="customerInput" class="customer-input" placeholder="输入客户姓名">
        <button id="addCustomer">＋ 新增客户</button>
      </div>
      <div id="names" class="names"></div>
    </div>

    <div class="card">
      <div class="type toolbar">
        <button data-type="lend" class="active">借出</button>
        <button data-type="repay">还款</button>
        <button data-type="income">其他收入</button>
      </div>
      <div class="formrow" style="margin-top:10px">
        <input id="amount" class="amount" type="number" min="0" step="0.01" placeholder="金额">
        <input id="note" class="note" placeholder="备注（可不填）">
        <button id="saveFlow" class="primary">保存流水</button>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button id="addCapital" class="green">＋ 增加本金</button>
        <button id="resetCapital">重置本金</button>
        <button id="clearDay" class="danger">清空本日流水</button>
        <button id="undoDelete" disabled>撤销删除</button>
      </div>
    </div>

    <div class="card">
      <input id="search" style="width:100%" placeholder="搜索客户、备注、金额">
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat">借出<b id="sumLend">0.00</b></div>
        <div class="stat">还款<b id="sumRepay">0.00</b></div>
        <div class="stat">其他收入<b id="sumIncome">0.00</b></div>
        <div class="stat">笔数<b id="count">0</b></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">本日流水</h3>
      <div id="ledger"></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">客户累计欠款</h3>
      <div id="balances"></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 8px">本金</h3>
      <div id="capitalText">0.00</div>
    </div>
  </div>

  <div id="history" class="card" style="display:none">
    <h3 style="margin-top:0">历史账单</h3>
    <div id="historyList"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var KEY="tonight_ledger_clean_v1";
var OLD_KEY="tonight_ledger_final_v4";
var state={version:1,currentDate:"",names:[],days:{}};
var viewDate="";
var selectedName="";
var selectedType="lend";
var lastDeleted=null;

function pad(n){return String(n).padStart(2,"0")}
function todayKey(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function nowText(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
    pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)}
function ensureDay(d){
  if(!state.days[d]) state.days[d]={flows:[],capital:0};
  if(!Array.isArray(state.days[d].flows)) state.days[d].flows=[];
}
function money(n){return Number(n||0).toFixed(2)}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var x=JSON.parse(raw);
      if(x && x.days){state=x}
    }else{
      var old=localStorage.getItem(OLD_KEY);
      if(old){
        var o=JSON.parse(old);
        state.names=Array.isArray(o.names)?o.names:[];
        var oldFlows=Array.isArray(o.flows)?o.flows:[];
        oldFlows.forEach(function(f){
          var d=(f.time||"").slice(0,10);
          if(!validDate(d)) d=todayKey();
          ensureDay(d);
          state.days[d].flows.push({
            id:Date.now()+Math.random(),
            type:f.type==="repay"?"repay":f.type==="income"?"income":"lend",
            name:f.name||"",
            amount:Number(f.amount)||0,
            note:f.note||"",
            time:f.time||nowText()
          });
        });
        state.days[todayKey()]=state.days[todayKey()]||{flows:[],capital:Number(o.capital)||0};
      }
    }
  }catch(e){}
  if(!Array.isArray(state.names))state.names=[];
  if(!state.days)state.days={};
  if(!validDate(state.currentDate))state.currentDate=todayKey();
  var real=todayKey();
  ensureDay(state.currentDate);
  if(state.currentDate!==real){
    state.currentDate=real;
    ensureDay(real);
  }
  viewDate=state.currentDate;
  save();
}
function updateClock(){
  var el=document.getElementById("clock");
  if(el)el.textContent="系统时间："+nowText();
}
function getDay(){ensureDay(viewDate);return state.days[viewDate]}
function typeText(t){return t==="lend"?"借出":t==="repay"?"还款":"其他收入"}
function renderNames(){
  var box=document.getElementById("names");
  box.innerHTML="";
  state.names.forEach(function(name){
    var b=document.createElement("button");
    b.className="namebtn"+(selectedName===name?" selected":"");
    b.textContent=name;
    b.title="双击删除客户名称（不会删除历史流水）";
    b.addEventListener("click",function(){
      selectedName=name;
      document.getElementById("customerInput").value=name;
      renderNames();
    });
    b.addEventListener("dblclick",function(){
      if(confirm("删除客户“"+name+"”？历史流水不会删除。")){
        state.names=state.names.filter(function(x){return x!==name});
        if(selectedName===name)selectedName="";
        save();render();
      }
    });
    box.appendChild(b);
  });
}
function renderStats(){
  var f=getDay().flows, a={lend:0,repay:0,income:0};
  f.forEach(function(x){a[x.type]+=Number(x.amount)||0});
  document.getElementById("sumLend").textContent=money(a.lend);
  document.getElementById("sumRepay").textContent=money(a.repay);
  document.getElementById("sumIncome").textContent=money(a.income);
  document.getElementById("count").textContent=f.length;
}
function renderLedger(){
  var box=document.getElementById("ledger"), f=getDay().flows.slice().reverse();
  var q=document.getElementById("search").value.trim().toLowerCase();
  f=f.filter(function(x){
    return !q || [x.name,x.note,x.amount,x.time,typeText(x.type)].join(" ").toLowerCase().includes(q);
  });
  if(!f.length){box.innerHTML='<div class="empty">暂无流水</div>';return}
  var table=document.createElement("table");
  table.innerHTML="<thead><tr><th>时间</th><th>客户</th><th>类型</th><th>金额</th><th>备注</th><th>操作</th></tr></thead>";
  var tb=document.createElement("tbody");
  f.forEach(function(x){
    var tr=document.createElement("tr");
    tr.innerHTML="<td>"+escapeHtml(x.time.slice(11))+"</td>"+
      "<td>"+escapeHtml(x.name)+"</td>"+
      "<td class='"+x.type+"'>"+typeText(x.type)+"</td>"+
      "<td>"+money(x.amount)+"</td>"+
      "<td>"+escapeHtml(x.note||"")+"</td>";
    var td=document.createElement("td");
    var del=document.createElement("button");
    del.textContent="删除";
    del.className="danger";
    del.disabled=viewDate!==state.currentDate;
    del.addEventListener("click",function(){deleteFlow(x.id)});
    td.appendChild(del);tr.appendChild(td);tb.appendChild(tr);
  });
  table.appendChild(tb);box.innerHTML="";box.appendChild(table);
}
function renderBalances(){
  var box=document.getElementById("balances"), sums={};
  Object.keys(state.days).forEach(function(d){
    state.days[d].flows.forEach(function(x){
      if(!x.name)return;
      if(!sums[x.name])sums[x.name]=0;
      if(x.type==="lend")sums[x.name]+=Number(x.amount)||0;
      if(x.type==="repay")sums[x.name]-=Number(x.amount)||0;
    });
  });
  var rows=Object.keys(sums).filter(function(n){return sums[n]!==0});
  if(!rows.length){box.innerHTML='<div class="empty">暂无客户欠款</div>';return}
  rows.sort(function(a,b){return sums[b]-sums[a]});
  var table=document.createElement("table");
  table.innerHTML="<thead><tr><th>客户</th><th>累计欠款</th></tr></thead>";
  var tb=document.createElement("tbody");
  rows.forEach(function(n){
    var tr=document.createElement("tr");
    tr.innerHTML="<td>"+escapeHtml(n)+"</td><td>"+money(sums[n])+"</td>";
    tb.appendChild(tr);
  });
  table.appendChild(tb);box.innerHTML="";box.appendChild(table);
}
function renderHistory(){
  var box=document.getElementById("historyList"), ds=Object.keys(state.days).sort().reverse();
  if(!ds.length){box.innerHTML='<div class="empty">暂无历史账单</div>';return}
  box.innerHTML="";
  ds.forEach(function(d){
    var day=state.days[d], lend=0,repay=0;
    day.flows.forEach(function(x){
      if(x.type==="lend")lend+=Number(x.amount)||0;
      if(x.type==="repay")repay+=Number(x.amount)||0;
    });
    var row=document.createElement("div");row.className="history-item";
    var left=document.createElement("div");
    left.innerHTML="<b>"+d+"</b><div class='badge'>借出 "+money(lend)+"　还款 "+money(repay)+"　"+day.flows.length+" 笔</div>";
    var b=document.createElement("button");b.textContent="查看";
    b.addEventListener("click",function(){openHistoryDate(d)});
    row.appendChild(left);row.appendChild(b);box.appendChild(row);
  });
}
function render(){
  document.getElementById("dateTitle").textContent="账单日期："+viewDate;
  document.getElementById("viewBadge").textContent=viewDate===state.currentDate?"（当前）":"（历史，只读）";
  document.getElementById("currentBtn").disabled=viewDate===state.currentDate;
  var readonly=viewDate!==state.currentDate;
  ["customerInput","addCustomer","amount","note","saveFlow","addCapital","resetCapital","clearDay"].forEach(function(id){
    document.getElementById(id).disabled=readonly;
  });
  renderNames();renderStats();renderLedger();renderBalances();
  document.getElementById("capitalText").textContent=money(getDay().capital);
  renderHistory();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})
}
function addCustomer(){
  if(viewDate!==state.currentDate)return;
  var input=document.getElementById("customerInput"),name=input.value.trim();
  if(!name){alert("请先输入客户姓名");input.focus();return}
  if(!state.names.includes(name))state.names.push(name);
  selectedName=name;save();render();
}
function saveFlow(){
  if(viewDate!==state.currentDate)return;
  var name=document.getElementById("customerInput").value.trim();
  var amount=Number(document.getElementById("amount").value);
  var note=document.getElementById("note").value.trim();
  if(!name){alert("请选择或输入客户姓名");return}
  if(!(amount>0)){alert("请输入大于0的金额");return}
  if(!state.names.includes(name))state.names.push(name);
  getDay().flows.push({id:Date.now()+Math.random(),type:selectedType,name:name,amount:amount,note:note,time:nowText()});
  document.getElementById("amount").value="";
  document.getElementById("note").value="";
  selectedName=name;save();render();
}
function addCapital(){
  var n=Number(prompt("请输入增加的本金：","0"));
  if(!(n>0))return;
  getDay().capital+=n;save();render();
}
function resetCapital(){
  if(confirm("确定把本日本金重置为 0 吗？")){getDay().capital=0;save();render()}
}
function deleteFlow(id){
  var f=getDay().flows,i=f.findIndex(function(x){return x.id===id});
  if(i<0)return;
  if(!confirm("确定删除这笔流水吗？"))return;
  lastDeleted={date:viewDate,flow:f[i],index:i};
  f.splice(i,1);save();render();
  document.getElementById("undoDelete").disabled=false;
}
function undoDelete(){
  if(!lastDeleted)return;
  ensureDay(lastDeleted.date);
  state.days[lastDeleted.date].flows.splice(lastDeleted.index,0,lastDeleted.flow);
  lastDeleted=null;save();render();
  document.getElementById("undoDelete").disabled=true;
}
function clearDay(){
  if(!confirm("确定清空“"+viewDate+"”的全部流水吗？此操作可用撤销删除恢复不了，请确认。"))return;
  getDay().flows=[];save();render();
}
function startNewDay(){
  var real=todayKey();
  if(state.currentDate!==real){
    state.currentDate=real;ensureDay(real);viewDate=real;save();render();return;
  }
  var d=new Date();d.setDate(d.getDate()+1);
  var next=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  if(!confirm("手机当前日期还是 "+real+"。\n要提前建立下一天 "+next+" 的账单吗？"))return;
  state.currentDate=next;ensureDay(next);viewDate=next;save();render();
}
function openHistory(){
  document.getElementById("main").style.display="none";
  document.getElementById("history").style.display="block";
  renderHistory();
}
function openHistoryDate(d){
  viewDate=d;
  document.getElementById("main").style.display="block";
  document.getElementById("history").style.display="none";
  render();
}
function backCurrent(){
  state.currentDate=todayKey();ensureDay(state.currentDate);viewDate=state.currentDate;save();
  document.getElementById("main").style.display="block";
  document.getElementById("history").style.display="none";render();
}
document.addEventListener("DOMContentLoaded",function(){
  load();
  updateClock();
  setInterval(updateClock,1000);
  document.getElementById("addCustomer").addEventListener("click",addCustomer);
  document.getElementById("saveFlow").addEventListener("click",saveFlow);
  document.getElementById("newDay").addEventListener("click",startNewDay);
  document.getElementById("historyBtn").addEventListener("click",openHistory);
  document.getElementById("currentBtn").addEventListener("click",backCurrent);
  document.getElementById("addCapital").addEventListener("click",addCapital);
  document.getElementById("resetCapital").addEventListener("click",resetCapital);
  document.getElementById("clearDay").addEventListener("click",clearDay);
  document.getElementById("undoDelete").addEventListener("click",undoDelete);
  document.getElementById("search").addEventListener("input",renderLedger);
  document.getElementById("customerInput").addEventListener("keydown",function(e){if(e.key==="Enter")addCustomer()});
  document.getElementById("amount").addEventListener("keydown",function(e){if(e.key==="Enter")saveFlow()});
  document.querySelectorAll(".type button").forEach(function(b){
    b.addEventListener("click",function(){
      selectedType=b.dataset.type;
      document.querySelectorAll(".type button").forEach(function(x){x.classList.remove("active")});
      b.classList.add("active");
    });
  });
  render();
});
})();
</script>
</body>
</html>
