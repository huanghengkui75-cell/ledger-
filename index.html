<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>今晚流水账</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f3f5f8;
    color:#20242b;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "PingFang SC","Microsoft YaHei",Arial,sans-serif;
}

body{
    min-height:100vh;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding-bottom:50px;
}

/* 顶部 */

.top{
    background:linear-gradient(135deg,#111827,#1d2738);
    color:white;
    padding:28px 20px 24px;
    border-radius:0 0 26px 26px;
    box-shadow:0 8px 25px rgba(15,23,42,.15);
}

.top-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:7px;
}

.top-time{
    font-size:14px;
    opacity:.7;
    margin-bottom:20px;
}

/* 统计 */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat{
    background:#273142;
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px;
    padding:16px;
}

.stat-label{
    font-size:14px;
    color:#aeb7c5;
    margin-bottom:8px;
}

.stat-value{
    font-size:24px;
    font-weight:800;
    color:white;
}

/* 主体 */

.content{
    padding:18px 16px;
}

/* 卡片 */

.card{
    background:white;
    border-radius:22px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:
        0 5px 20px rgba(15,23,42,.06),
        0 1px 3px rgba(15,23,42,.05);
}

.card-title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.card-title{
    font-size:22px;
    font-weight:800;
}

.card-sub{
    font-size:13px;
    color:#9aa2ad;
}

/* 客户 */

.field{
    margin-bottom:16px;
}

.label{
    font-size:15px;
    color:#6b7280;
    margin-bottom:8px;
    font-weight:600;
}

input{
    width:100%;
    height:58px;
    border:1.5px solid #dce1e8;
    border-radius:16px;
    padding:0 17px;
    font-size:18px;
    outline:none;
    background:#fff;
    color:#20242b;
    transition:.2s;
}

input:focus{
    border-color:#377cf6;
    box-shadow:0 0 0 3px rgba(55,124,246,.10);
}

input::placeholder{
    color:#b6bdc7;
}

/* 类型 */

.type-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.type-btn{
    height:56px;
    border:0;
    border-radius:16px;
    background:#edf0f4;
    color:#347af4;
    font-size:19px;
    font-weight:700;
}

.type-btn.active.loan{
    background:#377cf6;
    color:white;
}

.type-btn.active.return{
    background:#18a873;
    color:white;
}

/* 保存 */

.save-btn{
    width:100%;
    height:60px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,#377cf6,#2467dc);
    color:white;
    font-size:20px;
    font-weight:800;
    box-shadow:0 8px 18px rgba(55,124,246,.22);
}

.save-btn:active{
    transform:scale(.985);
}

/* 清空 */

.clear-btn{
    width:100%;
    height:54px;
    border:0;
    border-radius:16px;
    background:#f0f2f5;
    color:#333b48;
    font-size:17px;
    font-weight:700;
    margin-top:10px;
}

/* 本金 */

.principal-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.principal-item{
    background:#f7f8fa;
    border-radius:17px;
    padding:15px;
}

.principal-label{
    color:#7a8390;
    font-size:14px;
    margin-bottom:6px;
}

.principal-number{
    font-size:23px;
    font-weight:800;
}

.add-principal{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #edf0f3;
}

.add-row{
    display:grid;
    grid-template-columns:1fr 120px;
    gap:10px;
}

.add-row button{
    border:0;
    border-radius:15px;
    background:#111827;
    color:white;
    font-size:17px;
    font-weight:700;
}

/* 流水 */

.ledger-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.ledger-count{
    color:#9aa2ad;
    font-size:14px;
}

.ledger-empty{
    text-align:center;
    padding:35px 10px;
    color:#a3aab5;
}

/* 每一笔单独一张 */

.record{
    border:1px solid #e8ebef;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
    background:#fff;
}

.record:last-child{
    margin-bottom:0;
}

.record-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.record-name{
    font-size:19px;
    font-weight:800;
}

.record-type{
    padding:5px 10px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

.record-type.loan{
    color:#377cf6;
    background:#edf4ff;
}

.record-type.return{
    color:#159669;
    background:#eaf9f3;
}

.record-type.other{
    color:#9b6a00;
    background:#fff7df;
}

.record-amount{
    font-size:25px;
    font-weight:850;
    margin-top:10px;
}

.record-amount.loan{
    color:#377cf6;
}

.record-amount.return{
    color:#159669;
}

.record-amount.other{
    color:#b77900;
}

.record-time{
    font-size:13px;
    color:#9aa2ad;
    margin-top:8px;
}

.record-note{
    margin-top:8px;
    font-size:14px;
    color:#687180;
    background:#f7f8fa;
    padding:9px 11px;
    border-radius:10px;
}

.delete-record{
    margin-top:12px;
    width:100%;
    height:40px;
    border:0;
    border-radius:11px;
    background:#f5f6f8;
    color:#8b929c;
    font-size:14px;
}

/* 提示 */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,20px);
    background:#111827;
    color:white;
    padding:12px 20px;
    border-radius:14px;
    font-size:15px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:9999;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* 小屏 */

@media(max-width:380px){
    .top{
        padding:24px 15px 20px;
    }

    .content{
        padding:15px 12px;
    }

    .card{
        padding:16px;
    }

    .stat-value{
        font-size:21px;
    }

    .add-row{
        grid-template-columns:1fr 105px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- 顶部 -->
    <div class="top">

        <div class="top-title">
            今晚流水账
        </div>

        <div class="top-time" id="currentTime">
            --
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-label">当前本金余额</div>
                <div class="stat-value" id="balance">¥0</div>
            </div>

            <div class="stat">
                <div class="stat-label">今晚借出</div>
                <div class="stat-value" id="loanTotal">¥0</div>
            </div>

            <div class="stat">
                <div class="stat-label">今晚收回</div>
                <div class="stat-value" id="returnTotal">¥0</div>
            </div>

            <div class="stat">
                <div class="stat-label">其他收入</div>
                <div class="stat-value" id="otherTotal">¥0</div>
            </div>

        </div>
    </div>


    <div class="content">

        <!-- 客户 -->
        <div class="card">

            <div class="card-title-row">
                <div class="card-title">客户</div>
                <div class="card-sub">输入过的名字会自动保留</div>
            </div>

            <div class="field">

                <div class="label">客户姓名</div>

                <input
                    id="customer"
                    list="customerList"
                    autocomplete="off"
                    placeholder="例如：葵"
                >

                <datalist id="customerList"></datalist>

            </div>

            <div class="field">

                <div class="label">类型</div>

                <div class="type-buttons">

                    <button
                        id="loanBtn"
                        class="type-btn active loan"
                        onclick="selectType('loan')"
                    >
                        借出
                    </button>

                    <button
                        id="returnBtn"
                        class="type-btn"
                        onclick="selectType('return')"
                    >
                        收回
                    </button>

                </div>

            </div>

            <div class="field">

                <div class="label">金额</div>

                <input
                    id="amount"
                    type="number"
                    inputmode="decimal"
                    step="0.01"
                    placeholder="请输入金额"
                >

            </div>

            <!-- 其他收入放在金额下面 -->
            <div class="field">

                <div class="label">
                    其他收入
                    <span style="font-weight:400;color:#9aa2ad;">
                        （独立记录，不计入本金）
                    </span>
                </div>

                <input
                    id="otherIncome"
                    type="number"
                    inputmode="decimal"
                    step="0.01"
                    placeholder="没有就留空"
                >

            </div>

            <div class="field">

                <div class="label">备注</div>

                <input
                    id="note"
                    type="text"
                    placeholder="可以填写备注"
                >

            </div>

            <!-- 保存放在输入金额下面的区域 -->
            <button
                class="save-btn"
                onclick="saveRecord()"
            >
                保存并继续
            </button>

            <button
                class="clear-btn"
                onclick="clearForm()"
            >
                清空
            </button>

        </div>


        <!-- 今晚本金 -->
        <div class="card">

            <div class="card-title-row">
                <div class="card-title">今晚本金</div>
                <div class="card-sub">今晚带来的本金</div>
            </div>

            <div class="principal-box">

                <div class="principal-item">
                    <div class="principal-label">
                        今晚初始本金
                    </div>

                    <div class="principal-number">
                        <span id="initialPrincipalText">¥0</span>
                    </div>
                </div>

                <div class="principal-item">
                    <div class="principal-label">
                        加入本金
                    </div>

                    <div class="principal-number">
                        <span id="addedPrincipalText">¥0</span>
                    </div>
                </div>

                <div class="principal-item">
                    <div class="principal-label">
                        借出后本金
                    </div>

                    <div class="principal-number">
                        <span id="loanPrincipalText">¥0</span>
                    </div>
                </div>

                <div class="principal-item">
                    <div class="principal-label">
                        收回后本金
                    </div>

                    <div class="principal-number">
                        <span id="returnPrincipalText">¥0</span>
                    </div>
                </div>

            </div>


            <!-- 设置今晚本金 -->

            <div class="add-principal">

                <div class="label">
                    设置今晚带入本金
                </div>

                <div class="add-row">

                    <input
                        id="initialPrincipal"
                        type="number"
                        inputmode="decimal"
                        placeholder="例如：30000"
                    >

                    <button onclick="setInitialPrincipal()">
                        设置
                    </button>

                </div>

            </div>


            <!-- 加入本金 -->

            <div class="add-principal">

                <div class="label">
                    加入本金
                    <span style="font-weight:400;color:#9aa2ad;">
                        例如昨天有人还3000
                    </span>
                </div>

                <div class="add-row">

                    <input
                        id="addPrincipal"
                        type="number"
                        inputmode="decimal"
                        placeholder="例如：3000"
                    >

                    <button onclick="addPrincipal()">
                        加入
                    </button>

                </div>

            </div>

        </div>


        <!-- 今晚流水 -->

        <div class="card">

            <div class="ledger-header">

                <div class="card-title">
                    今晚流水
                </div>

                <div class="ledger-count">
                    <span id="recordCount">0</span> 笔
                </div>

            </div>

            <div id="ledger">

                <div class="ledger-empty">
                    暂无今晚流水
                </div>

            </div>

        </div>

    </div>
</div>


<div class="toast" id="toast">
    已保存
</div>


<script>

/* ================================
   数据
================================ */

const STORAGE_KEY = "tonight_ledger_v1";

let data = {
    initialPrincipal: 0,
    addedPrincipal: 0,
    records: [],
    customers: []
};

let currentType = "loan";


/* ================================
   读取数据
================================ */

function loadData(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){

            const obj = JSON.parse(saved);

            if(obj && typeof obj === "object"){

                data.initialPrincipal =
                    Number(obj.initialPrincipal) || 0;

                data.addedPrincipal =
                    Number(obj.addedPrincipal) || 0;

                data.records =
                    Array.isArray(obj.records)
                    ? obj.records
                    : [];

                data.customers =
                    Array.isArray(obj.customers)
                    ? obj.customers
                    : [];

            }

        }

    }catch(e){

        console.log("读取数据失败",e);

    }

    render();
}


/* ================================
   保存数据
================================ */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* ================================
   今天日期
================================ */

function todayKey(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* ================================
   当前时间
================================ */

function updateClock(){

    const d = new Date();

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    const h = String(d.getHours()).padStart(2,"0");

    const min = String(d.getMinutes()).padStart(2,"0");

    const sec = String(d.getSeconds()).padStart(2,"0");

    document.getElementById("currentTime").textContent =
        y + "年" + m + "月" + day + "日  " +
        h + ":" + min + ":" + sec;

}

setInterval(updateClock,1000);

updateClock();


/* ================================
   金额格式
================================ */

function money(n){

    n = Number(n) || 0;

    return "¥" + n.toLocaleString(
        "zh-CN",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* ================================
   选择借出 / 收回
================================ */

function selectType(type){

    currentType = type;

    const loanBtn =
        document.getElementById("loanBtn");

    const returnBtn =
        document.getElementById("returnBtn");

    loanBtn.classList.remove("active");

    returnBtn.classList.remove("active");

    if(type === "loan"){

        loanBtn.classList.add("active");

    }else{

        returnBtn.classList.add("active");

    }

}


/* ================================
   保存客户名字
================================ */

function rememberCustomer(name){

    name = name.trim();

    if(!name){
        return;
    }

    if(!data.customers.includes(name)){

        data.customers.unshift(name);

        if(data.customers.length > 100){
            data.customers =
                data.customers.slice(0,100);
        }

    }

}


/* ================================
   客户名单
================================ */

function renderCustomers(){

    const list =
        document.getElementById("customerList");

    list.innerHTML = "";

    data.customers.forEach(name => {

        const option =
            document.createElement("option");

        option.value = name;

        list.appendChild(option);

    });

}


/* ================================
   保存一笔流水
================================ */

function saveRecord(){

    const customer =
        document.getElementById("customer")
        .value.trim();

    const amount =
        Number(
            document.getElementById("amount").value
        ) || 0;

    const otherIncome =
        Number(
            document.getElementById("otherIncome").value
        ) || 0;

    const note =
        document.getElementById("note").value.trim();


    /* 必须至少输入客户+金额，或者其他收入 */

    if(!customer && amount <= 0 && otherIncome <= 0){

        showToast("请输入客户或金额");

        return;

    }


    /* 普通流水 */

    if(customer && amount > 0){

        const now = new Date();

        const record = {

            id:
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .slice(2),

            dateKey:todayKey(),

            customer:customer,

            type:currentType,

            amount:amount,

            note:note,

            time:formatDateTime(now)

        };

        data.records.unshift(record);

        rememberCustomer(customer);

    }


    /* 其他收入 */

    if(otherIncome > 0){

        const now = new Date();

        const record = {

            id:
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .slice(2),

            dateKey:todayKey(),

            customer:
                customer || "其他收入",

            type:"other",

            amount:otherIncome,

            note:
                note || "其他收入",

            time:formatDateTime(now)

        };

        data.records.unshift(record);

        if(customer){

            rememberCustomer(customer);

        }

    }


    saveData();

    render();

    /* 保存后马上清空金额，方便下一笔 */

    document.getElementById("amount").value = "";

    document.getElementById("otherIncome").value = "";

    document.getElementById("note").value = "";

    /*
       客户姓名故意不清空。
       下一笔可以继续使用这个名字，
       也可以直接换另外一个名字。
    */

    document.getElementById("amount").focus();

    showToast("已保存，流水已更新");

}


/* ================================
   日期时间
================================ */

function formatDateTime(d){

    const y = d.getFullYear();

    const m = String(d.getMonth()+1).padStart(2,"0");

    const day = String(d.getDate()).padStart(2,"0");

    const h = String(d.getHours()).padStart(2,"0");

    const min = String(d.getMinutes()).padStart(2,"0");

    const sec = String(d.getSeconds()).padStart(2,"0");

    return (
        y + "-" +
        m + "-" +
        day + " " +
        h + ":" +
        min + ":" +
        sec
    );

}


/* ================================
   设置初始本金
================================ */

function setInitialPrincipal(){

    const input =
        document.getElementById("initialPrincipal");

    const amount =
        Number(input.value) || 0;

    if(amount < 0){

        showToast("本金不能小于0");

        return;

    }

    data.initialPrincipal = amount;

    saveData();

    render();

    input.value = "";

    showToast("今晚本金已设置");

}


/* ================================
   加入本金
================================ */

function addPrincipal(){

    const input =
        document.getElementById("addPrincipal");

    const amount =
        Number(input.value) || 0;

    if(amount <= 0){

        showToast("请输入加入本金金额");

        return;

    }

    data.addedPrincipal += amount;

    saveData();

    render();

    input.value = "";

    showToast("本金已加入");

}


/* ================================
   计算今晚流水
================================ */

function getTonightRecords(){

    const key = todayKey();

    return data.records.filter(
        r => r.dateKey === key
    );

}


/* ================================
   计算统计
================================ */

function calculate(){

    const records =
        getTonightRecords();

    let loan = 0;

    let returned = 0;

    let other = 0;

    records.forEach(r => {

        if(r.type === "loan"){

            loan += Number(r.amount) || 0;

        }

        else if(r.type === "return"){

            returned += Number(r.amount) || 0;

        }

        else if(r.type === "other"){

            other += Number(r.amount) || 0;

        }

    });


    const balance =
        data.initialPrincipal +
        data.addedPrincipal -
        loan +
        returned;


    return {
        loan,
        returned,
        other,
        balance
    };

}


/* ================================
   渲染
================================ */

function render(){

    const stats = calculate();

    document.getElementById("balance").textContent =
        money(stats.balance);

    document.getElementById("loanTotal").textContent =
        money(stats.loan);

    document.getElementById("returnTotal").textContent =
        money(stats.returned);

    document.getElementById("otherTotal").textContent =
        money(stats.other);


    document.getElementById("initialPrincipalText").textContent =
        money(data.initialPrincipal);

    document.getElementById("addedPrincipalText").textContent =
        money(data.addedPrincipal);

    const loanPrincipal =
        data.initialPrincipal +
        data.addedPrincipal -
        stats.loan;

    const returnPrincipal =
        loanPrincipal +
        stats.returned;

    document.getElementById("loanPrincipalText").textContent =
        money(loanPrincipal);

    document.getElementById("returnPrincipalText").textContent =
        money(returnPrincipal);


    renderCustomers();

    renderLedger();

}


/* ================================
   流水
================================ */

function renderLedger(){

    const ledger =
        document.getElementById("ledger");

    const records =
        getTonightRecords();

    document.getElementById("recordCount").textContent =
        records.length;


    if(records.length === 0){

        ledger.innerHTML =
            '<div class="ledger-empty">暂无今晚流水</div>';

        return;

    }


    ledger.innerHTML = "";


    records.forEach(record => {

        const div =
            document.createElement("div");

        div.className = "record";


        let typeText = "";

        if(record.type === "loan"){
            typeText = "借出";
        }
        else if(record.type === "return"){
            typeText = "收回";
        }
        else{
            typeText = "其他收入";
        }


        div.innerHTML = `

            <div class="record-top">

                <div class="record-name">
                    ${escapeHtml(record.customer)}
                </div>

                <div class="record-type ${record.type}">
                    ${typeText}
                </div>

            </div>

            <div class="record-amount ${record.type}">
                ${record.type === "loan" ? "-" : "+"}${money(record.amount)}
            </div>

            <div class="record-time">
                ${record.time}
            </div>

            ${
                record.note
                ?
                `<div class="record-note">
                    备注：${escapeHtml(record.note)}
                </div>`
                :
                ""
            }

            <button
                class="delete-record"
                onclick="deleteRecord('${record.id}')"
            >
                删除这一笔
            </button>
        `;


        ledger.appendChild(div);

    });

}


/* ================================
   删除流水
================================ */

function deleteRecord(id){

    const ok =
        confirm("确定删除这一笔流水吗？");

    if(!ok){
        return;
    }

    data.records =
        data.records.filter(
            r => r.id !== id
        );

    saveData();

    render();

    showToast("已删除");

}


/* ================================
   清空输入
================================ */

function clearForm(){

    document.getElementById("customer").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("otherIncome").value = "";

    document.getElementById("note").value = "";

    document.getElementById("amount").blur();

}


/* ================================
   HTML 安全处理
================================ */

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================================
   提示
================================ */

let toastTimer = null;

function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },1800);

}


/* ================================
   启动
================================ */

loadData();

</script>

</body>
</html>
