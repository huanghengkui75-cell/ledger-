<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今晚流水记账</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#17202b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{max-width:760px;margin:auto;padding:12px 12px 40px}
h1{font-size:25px;margin:4px 4px 4px;font-weight:850}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px;color:#7c8793;font-size:13px}
.card{background:#fff;border:1px solid #e3e7ed;border-radius:18px;box-shadow:0 5px 18px #1923320b;overflow:hidden;margin-bottom:12px}
.form{padding:14px}.title{font-size:18px;font-weight:850;margin-bottom:10px}
input{width:100%;height:50px;border:1px solid #d9dee6;border-radius:13px;background:#fff;padding:0 14px;font-size:16px;outline:0}
input:focus{border-color:#2878f5;box-shadow:0 0 0 3px #2878f518}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
button{height:50px;border:0;border-radius:13px;background:#2878f5;color:#fff;font-size:16px;font-weight:800}
button.gray{background:#edf1f5;color:#29313b}button.dark{background:#171e2a}
button.red{background:#fff0f0;color:#d94646;border:1px solid #ffd5d5}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.name{padding:9px 13px;border:1px solid #e0e5eb;background:#fafbfc;border-radius:11px;font-weight:650}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#e5e9ee}
.stat{background:#fff;padding:14px}.stat small{color:#7d8792;font-size:13px}.stat b{display:block;font-size:23px;margin-top:4px}
.stat.red b{color:#df4c4c}.stat.green b{color:#19915a}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #e7ebef}
.head b{font-size:18px}.head span{font-size:13px;color:#8a949f}
.group{margin:12px;border:1px solid #e0e5eb;border-radius:14px;overflow:hidden}
.grouphead{padding:12px 13px;background:#f7f9fb;display:flex;justify-content:space-between;font-weight:800}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:12px 13px;border-top:1px solid #edf0f3}
.txmain{font-size:15px;line-height:1.45}.time{font-size:12px;color:#929ba6}.amt{font-size:18px;font-weight:850}.minus{color:#df4c4c}.plus{color:#19915a}
.txbtn{height:34px;width:auto;padding:0 9px;border-radius:9px;background:#fff0f0;color:#d94646;font-size:13px;border:1px solid #ffd5d5}
.sub{padding:9px 13px;text-align:right;background:#fbfcfd;border-top:1px solid #e7ebef;font-size:13px;font-weight:750}
.empty{padding:28px 14px;text-align:center;color:#929ba5}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}
.tools button{height:44px;font-size:14px}
.notice{font-size:12px;color:#8a949f;margin-top:8px;line-height:1.5}
.principal{display:grid;grid-template-columns:1fr 1fr}
.principal>div{padding:14px;border-right:1px solid #e7ebef}
.principal>div:last-child{border:0}
.money{font-size:24px;font-weight:900;margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171e2a;color:white;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
.toast.show{opacity:1}
@media(max-width:430px){
.row2{grid-template-columns:1fr}
.principal{grid-template-columns:1fr 1fr}
.tx{grid-template-columns:1fr auto auto}
}
</style>
</head>

<body>
<div class="app">

<h1>今晚流水记账</h1>

<div class="topbar">
<span>实时系统时间</span>
<b id="clock">--</b>
</div>

<!-- 客户 -->
<div class="card form">
<div class="title">客户</div>

<input id="customer"
placeholder="输入或选择客户姓名"
autocomplete="off">

<div id="names" class="names"></div>
</div>


<!-- 本金 -->
<div class="card">

<div class="principal">

<div>
<small>今晚带入本金</small>
<div class="money" id="capitalIn">¥0</div>
</div>

<div>
<small>当前本金余额</small>
<div class="money" id="capitalNow">¥0</div>
</div>

</div>

<div class="form" style="border-top:1px solid #e7ebef">

<div class="title">本金操作</div>

<div class="row2">

<input
id="capitalAmount"
type="number"
inputmode="decimal"
placeholder="输入本金金额">

<input
id="capitalNote"
placeholder="备注，例如：昨天回款">

</div>

<div class="btns">

<button id="addCapital">
加入本金
</button>

<button class="gray" id="resetCapital">
重新设置本金
</button>

</div>

<div class="notice">
例如今晚带 ¥30,000；昨天有人回款 ¥3,000，可以用“加入本金”把这 ¥3,000 加回来。
</div>

</div>
</div>


<!-- 新增流水 -->
<div class="card form">

<div class="title">新增流水</div>

<div class="row2">

<input
id="amount"
type="number"
inputmode="decimal"
placeholder="输入金额">

<input
id="flowTime"
type="datetime-local">

</div>

<div style="height:10px"></div>

<input
id="note"
placeholder="备注（可不填）">

<div class="btns">

<button id="lend">
借出
</button>

<button class="gray" id="repay">
还款
</button>

</div>

<div class="btns">

<button class="dark" id="other">
其他收入
</button>

<button class="gray" id="clear">
清空输入
</button>

</div>

</div>


<!-- 今晚统计 -->
<div class="card">

<div class="head">
<b>今晚统计</b>
<span>自动计算</span>
</div>

<div class="stats">

<div class="stat red">
<small>今晚借出</small>
<b id="sumLend">¥0</b>
</div>

<div class="stat green">
<small>今晚回款</small>
<b id="sumRepay">¥0</b>
</div>

<div class="stat">
<small>其他收入</small>
<b id="sumOther">¥0</b>
</div>

<div class="stat">
<small>流水笔数</small>
<b id="count">0</b>
</div>

</div>
</div>


<!-- 流水 -->
<div class="card">

<div class="head">
<b>今晚流水</b>
<span>按客户分组 · 每笔独立</span>
</div>

<div class="form" style="padding-bottom:6px">

<input
id="search"
placeholder="搜索客户、备注或金额">

</div>

<div id="ledger"></div>

<div class="tools">

<button class="gray" id="undo">
撤销删除
</button>

<button class="gray" id="export">
导出备份
</button>

<button class="gray" id="clearAll">
清空今晚流水
</button>

</div>

</div>


<div class="toast" id="toast"></div>

</div>


<script>

const KEY="ledger_prototype_v3";

let data=JSON.parse(
localStorage.getItem(KEY)
||
'{"capital":0,"flows":[],"names":[]}'
);

let deleted=null;

const $=id=>document.getElementById(id);


function money(n){

return "¥"+
Number(n||0).toLocaleString(
"zh-CN",
{maximumFractionDigits:2}
);

}


function nowInput(){

const d=new Date();

const p=n=>String(n).padStart(2,"0");

return d.getFullYear()
+"-"+p(d.getMonth()+1)
+"-"+p(d.getDate())
+"T"+p(d.getHours())
+":"+p(d.getMinutes());

}


function displayTime(v){

const d=new Date(v);

if(isNaN(d))return v||"";

const p=n=>String(n).padStart(2,"0");

return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

render();

}


function toast(t){

$("toast").textContent=t;

$("toast").classList.add("show");

setTimeout(
()=>$("toast").classList.remove("show"),
1500
);

}


function systemClock(){

const d=new Date();

const p=n=>String(n).padStart(2,"0");

$("clock").textContent=
`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;

}


function renderNames(){

$("names").innerHTML=
data.names
.slice(0,12)
.map(n=>
`<button class="name"
onclick="pickName('${n.replace(/'/g,"&#39;")}')">
${n}
</button>`
)
.join("");

}


function pickName(n){

$("customer").value=n;

toast("已选择："+n);

}


function render(){

renderNames();

$("flowTime").value=
$("flowTime").value||nowInput();


$("capitalIn").textContent=
money(data.capital);


const balance=
data.capital
-
data.flows
.filter(x=>x.type==="lend")
.reduce((a,x)=>a+x.amount,0)
+
data.flows
.filter(x=>x.type==="repay"||x.type==="other")
.reduce((a,x)=>a+x.amount,0);


$("capitalNow").textContent=
money(balance);


let lend=0,
repay=0,
other=0;


data.flows.forEach(x=>{

if(x.type==="lend")
lend+=x.amount;

if(x.type==="repay")
repay+=x.amount;

if(x.type==="other")
other+=x.amount;

});


$("sumLend").textContent=money(lend);

$("sumRepay").textContent=money(repay);

$("sumOther").textContent=money(other);

$("count").textContent=data.flows.length;


const q=
$("search").value
.trim()
.toLowerCase();


const list=
data.flows.filter(x=>
!q ||
`${x.customer} ${x.note} ${x.amount}`
.toLowerCase()
.includes(q)
);


const groups={};


list.forEach(x=>
(groups[x.customer]??=[]).push(x)
);


let out="";


Object.entries(groups)
.forEach(([name,arr])=>{

let bal=
arr.reduce(
(a,x)=>
a+
(x.type==="lend"
?x.amount
:-x.amount),
0
);


out+=
`<div class="group">

<div class="grouphead">
<span>${name}</span>
<span>
${bal>=0?"欠 ":"结余 "}
${money(Math.abs(bal))}
</span>
</div>`;


arr.forEach(x=>{

const label=
x.type==="lend"
?"借出"
:x.type==="repay"
?"还款"
:"其他收入";


out+=
`<div class="tx">

<div class="txmain">
${label}${x.note?" · "+x.note:""}
<br>
<span class="time">
${displayTime(x.time)}
</span>
</div>

<div class="amt ${x.type==="lend"?"minus":"plus"}">
${x.type==="lend"?"-":"+"}${money(x.amount).slice(1)}
</div>

<button
class="txbtn"
onclick="delFlow('${x.id}')">
删除
</button>

</div>`;

});


out+=
`<div class="sub">
本组当前：
${bal>=0?"欠款 ":"结余 "}
${money(Math.abs(bal))}
</div>

</div>`;

});


$("ledger").innerHTML=
out||
'<div class="empty">今晚还没有流水</div>';

}


function addFlow(type){

const customer=
$("customer").value.trim();

const amount=
Number($("amount").value);


if(!customer){

toast("先输入客户姓名");

$("customer").focus();

return;

}


if(!amount||amount<=0){

toast("请输入正确金额");

$("amount").focus();

return;

}


const flow={

id:Date.now()+"",

customer,

amount,

type,

time:$("flowTime").value||nowInput(),

note:$("note").value.trim()

};


data.flows.push(flow);


if(!data.names.includes(customer))
data.names.unshift(customer);


data.names=data.names.slice(0,30);


$("amount").value="";

$("note").value="";

$("flowTime").value=nowInput();


save();

toast("已保存，流水已更新");


window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


function delFlow(id){

const i=
data.flows.findIndex(
x=>x.id===id
);


if(i<0)return;


deleted=
data.flows.splice(i,1)[0];


save();

toast("已删除，可点“撤销删除”恢复");

}


$("lend").onclick=
()=>addFlow("lend");


$("repay").onclick=
()=>addFlow("repay");


$("other").onclick=
()=>addFlow("other");


$("clear").onclick=()=>{

$("amount").value="";

$("note").value="";

$("flowTime").value=nowInput();

};


$("addCapital").onclick=()=>{

const n=
Number($("capitalAmount").value);


if(!n||n<=0){

toast("请输入本金金额");

return;

}


data.capital+=n;


$("capitalAmount").value="";

$("capitalNote").value="";


save();

toast("本金已加入");

};


$("resetCapital").onclick=()=>{

const n=
Number(
prompt(
"请输入今晚带入本金：",
data.capital||0
)
);


if(!isNaN(n)&&n>=0){

data.capital=n;

save();

toast("本金已重新设置");

}

};


$("undo").onclick=()=>{

if(!deleted){

toast("没有可撤销的删除");

return;

}


data.flows.push(deleted);

deleted=null;

save();

toast("已恢复");

};


$("clearAll").onclick=()=>{

if(
confirm(
"确定清空今晚全部流水？本金不会删除。"
)
){

data.flows=[];

save();

toast("今晚流水已清空");

}

};


$("search").oninput=render;


$("export").onclick=()=>{

const blob=
new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);


const a=
document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download=
"今晚流水备份-"+
new Date()
.toISOString()
.slice(0,10)+
".json";


a.click();


URL.revokeObjectURL(a.href);


toast("备份文件已生成");

};


$("flowTime").value=
nowInput();


setInterval(
systemClock,
1000
);


systemClock();

render();

</script>

</body>
</html>
