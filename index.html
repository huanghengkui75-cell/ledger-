<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>今晚流水记账</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7fa;--card:#fff;--ink:#17202d;--muted:#8c96a4;--line:#e5e9ee;--green:#159447;--green2:#087b39;--red:#df3d39;--blue:#1267d6;--purple:#7056d8}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}.app{width:min(100%,780px);margin:auto;padding:14px 12px 45px}
.top{text-align:center;padding:4px 0 12px}.top h1{margin:0;font-size:27px;font-weight:900}.clock{margin-top:5px;color:var(--muted);font-size:14px}.clock b{color:var(--green);font-variant-numeric:tabular-nums}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eff9f2;border:1px solid #cfe9d8;border-radius:16px;padding:10px 12px;margin-bottom:13px}.day-title{font-size:16px;font-weight:900;color:var(--green2)}.day-sub{font-size:11px;color:#70877a;margin-top:3px}.daybar button{border:1px solid #c9e2d1;background:#fff;color:var(--green2);border-radius:10px;height:38px;padding:0 12px;font-weight:900}
.card{background:#fff;border:1px solid #e6e9ee;border-radius:21px;margin-bottom:13px;overflow:hidden;box-shadow:0 6px 20px rgba(30,45,65,.065)}.section{padding:16px}
.title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:19px;font-weight:900;margin-bottom:12px;color:var(--green)}
.title small{font-size:12px;color:var(--muted)}
input{width:100%;height:52px;border:1px solid #dce1e7;border-radius:15px;padding:0 15px;background:#fff;color:var(--ink);font-size:16px;outline:none}input:focus{border-color:#70bb8b;box-shadow:0 0 0 4px rgba(21,148,71,.09)}
.name-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.name-box{display:flex}.name-btn{height:40px;padding:0 13px;border:1px solid #cde9d7;border-radius:12px 0 0 12px;background:#f0faf3;color:var(--green2);font-weight:850}.name-del{width:30px;height:40px;border:1px solid #cde9d7;border-left:0;border-radius:0 12px 12px 0;background:#fff5f4;color:var(--red);font-weight:900}
.small{height:34px;padding:0 11px;border:1px solid #cde9d7;border-radius:10px;background:#f3fbf6;color:var(--green2);font-weight:850}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.type{height:51px;border:1px solid #dce1e7;border-radius:14px;background:#fff;font-size:16px;font-weight:900}.type.lend.active{background:#159447;color:#fff;border-color:#159447}.type.repay.active{color:var(--red);border:1.5px solid #ef4a45}.type.other.active{color:var(--blue);border:1.5px solid #3981e5}
.btn{height:50px;border:0;border-radius:14px;font-size:16px;font-weight:900}.save{background:#159447;color:#fff}.outline{background:#fff;border:1px solid #cfe5d7;color:var(--green)}.gray{background:#f3f5f7;color:#303845}
.capital-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:12px}.capital-grid div{padding:13px 8px;text-align:center}.capital-grid div+div{border-left:1px solid var(--line)}.capital-grid small{display:block;color:#697483;margin-bottom:4px}.capital-grid b{font-size:22px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.help{margin-top:9px;color:#8993a1;font-size:12px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}.stat{border:1px solid #e8ebef;border-radius:12px;padding:11px 5px;text-align:center}.stat small{display:block;font-size:12px;margin-bottom:5px}.stat b{font-size:17px}.redbg{background:#fff7f6;color:var(--red)}.greenbg{background:#f4fbf6;color:var(--green)}.bluebg{background:#f4f8ff;color:var(--blue)}.purplebg{background:#f8f5ff;color:var(--purple)}
.search{padding:11px 14px;border-bottom:1px solid var(--line)}
.customer{margin:10px;border:1px solid #e2e7ec;border-radius:15px;overflow:hidden}.customer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;background:#fafbfd}.customer-head b{color:var(--green);font-size:17px}.customer-head span{font-size:12px;color:#667180}
.flow{display:grid;grid-template-columns:55px 1fr auto 34px;gap:8px;align-items:center;padding:10px 11px;border-top:1px solid #edf0f3}.badge{width:54px;text-align:center;border-radius:10px;padding:5px 2px;font-size:12px;font-weight:850}.badge.lend{background:#fff0ef;color:var(--red)}.badge.repay{background:#effaf2;color:var(--green)}.badge.other{background:#eef5ff;color:var(--blue)}.flow-note{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flow-time{font-size:11px;color:#9aa3ae;margin-top:3px}.amount{font-size:16px;font-weight:900;white-space:nowrap}.amount.lend{color:var(--red)}.amount.repay,.amount.other{color:var(--green)}.del{width:34px;height:34px;border:1px solid #ffd9d5;background:#fff7f6;color:var(--red);border-radius:10px}
.empty{text-align:center;padding:28px 10px;color:#9aa3ae;font-size:14px;line-height:1.7}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px}.bottom button{height:42px;border:1px solid #e2e6eb;background:#fff;border-radius:13px;color:#46505e;font-weight:800}
.history{padding:0 10px 12px}.history-item{border:1px solid #e1e6eb;border-radius:15px;margin-top:9px;padding:12px}.history-head{display:flex;justify-content:space-between;align-items:center}.history-head b{color:var(--green);font-size:16px}.history-head span{font-size:11px;color:#7b8590}.history-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.history-summary div{text-align:center;background:#f8fafb;border-radius:9px;padding:7px 2px}.history-summary small{display:block;color:#7d8793;font-size:10px}.history-summary b{font-size:12px}.history-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.history-buttons button{height:37px;border:1px solid #dfe4e9;background:#fff;border-radius:10px;font-weight:800}.history-buttons .view{color:var(--green);border-color:#cde5d5;background:#f5fbf7}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#18202c;color:#fff;padding:11px 17px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}
@media(max-width:520px){.app{padding:12px 10px 35px}.top h1{font-size:25px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.flow{grid-template-columns:54px 1fr auto 34px}.history-summary{grid-template-columns:1fr 1fr}.daybar{align-items:flex-start}.daybar button{height:34px}}
</style>
</head>
<body>
<div class="app">

<div class="top">
<h1>今晚流水记账</h1>
<div class="clock">实时系统时间　<b id="clock">--:--:--</b></div>
</div>

<div class="daybar">
<div><div class="day-title" id="dayTitle">当前账单：--</div><div class="day-sub">每天单独保存，昨天的数据不会因为换天消失</div></div>
<button id="newDayBtn" onclick="startNewDay()">＋ 开始新一天</button>
</div>

<div class="card">
<div class="section">
<div class="title"><span>♙　客户</span><button class="small" onclick="addCustomer()">＋ 新增客户</button></div>
<input id="customerInput" autocomplete="off" placeholder="输入或选择客户姓名">
<div id="nameList" class="name-list"></div>
</div>
</div>

<div class="card" id="entryCard">
<div class="section">
<div class="title"><span>◎　新增流水</span><small>保存自动记录时间</small></div>
<input id="amount" type="number" inputmode="decimal" placeholder="输入金额">
<input id="note" style="margin-top:10px" placeholder="备注（可不填）">
<div class="type-grid">
<button class="type lend active" id="lendBtn" onclick="selectType('lend')">↑　借出</button>
<button class="type repay" id="repayBtn" onclick="selectType('repay')">↓　还款</button>
</div>
<div class="type-grid">
<button class="type other" id="otherBtn" onclick="selectType('other')">▣　其他收入</button>
<button class="btn save" onclick="saveFlow()">保存流水</button>
</div>
</div>
</div>

<div class="card">
<div class="section">
<div class="title"><span>♧　本日本金</span></div>
<div class="capital-grid">
<div><small>本日带入本金</small><b id="capitalIn">¥0.00</b></div>
<div><small>本日当前本金</small><b id="capitalNow">¥0.00</b></div>
</div>
<div class="grid2">
<input id="capitalAmount" type="number" inputmode="decimal" placeholder="输入本金金额">
<input id="capitalNote" placeholder="备注，例如：昨天回款">
</div>
<div class="type-grid">
<button class="btn outline" onclick="addCapital()">＋ 加入本金</button>
<button class="btn gray" onclick="resetCapital()">⟳　重新设置本金</button>
</div>
<div class="help">本金也按日期保存。换一天后昨天本金不会被删除。</div>
</div>
</div>

<div class="card">
<div class="title" style="padding:15px 16px 6px"><span>▥　本日统计</span></div>
<div class="stats">
<div class="stat redbg"><small>本日借出</small><b id="sumLend">¥0.00</b></div>
<div class="stat greenbg"><small>本日回款</small><b id="sumRepay">¥0.00</b></div>
<div class="stat bluebg"><small>其他收入</small><b id="sumOther">¥0.00</b></div>
<div class="stat purplebg"><small>流水笔数</small><b id="count">0</b></div>
</div>
</div>

<div class="card">
<div class="title" style="padding:15px 16px 6px"><span>▤　客户余额</span><small>所有日期累计</small></div>
<div id="report"></div>
</div>

<div class="card">
<div class="title" style="padding:15px 16px 6px"><span id="ledgerTitle">▤　本日流水</span></div>
<div class="search"><input id="search" placeholder="⌕　搜索客户、备注或金额"></div>
<div id="ledger"></div>
<div class="bottom">
<button onclick="undoDelete()">↶　撤销删除</button>
<button onclick="clearDay()">▣　清空本日流水</button>
<button onclick="goTop()">↑　回到顶部</button>
</div>
</div>

<div class="card">
<div class="title" style="padding:15px 16px 6px"><span>📚　历史账单</span><small>点击查看每天记录</small></div>
<div id="history" class="history"></div>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

var KEY = "tonight_ledger_v6";
var OLD_KEY = "tonight_ledger_final_v4";
var selectedType = "lend";
var deletedRecord = null;
var state = loadState();
var viewDate = state.currentDate;

function $(id){ return document.getElementById(id); }

function pad(n){ return String(n).padStart(2,"0"); }

function dateKey(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function todayKey(){ return dateKey(new Date()); }

function money(n){
  return "¥"+Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function formatDate(key){
  var a=key.split("-");
  return a.length===3 ? a[0]+"年"+Number(a[1])+"月"+Number(a[2])+"日" : key;
}

function emptyDay(){
  return {flows:[],capital:0};
}

function loadState(){
  try{
    var saved=localStorage.getItem(KEY);
    if(saved){
      var s=JSON.parse(saved);
      if(s && s.days && Array.isArray(s.names) && s.currentDate){
        if(!s.days[s.currentDate]) s.days[s.currentDate]=emptyDay();
        return s;
      }
    }
  }catch(e){}

  var fresh={version:6,currentDate:todayKey(),names:[],days:{}};

  try{
    var oldRaw=localStorage.getItem(OLD_KEY);
    if(oldRaw){
      var old=JSON.parse(oldRaw);
      if(old && Array.isArray(old.names)) fresh.names=old.names.slice(0,50);
      var oldFlows=(old && Array.isArray(old.flows)) ? old.flows : [];
      oldFlows.forEach(function(f){
        var d=String(f.time||"").slice(0,10);
        if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d)) d=todayKey();
        if(!fresh.days[d]) fresh.days[d]=emptyDay();
        fresh.days[d].flows.push(f);
      });
      if(fresh.days[todayKey()]) fresh.days[todayKey()].capital=Number(old.capital||0);
    }
  }catch(e){}

  if(!fresh.days[fresh.currentDate]) fresh.days[fresh.currentDate]=emptyDay();
  try{localStorage.setItem(KEY,JSON.stringify(fresh));}catch(e){}
  return fresh;
}

function day(date){
  if(!state.days[date]) state.days[date]=emptyDay();
  return state.days[date];
}

function showToast(text){
  var t=$("toast");
  t.textContent=text;
  t.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(function(){t.classList.remove("show");},1700);
}

function updateClock(){
  var d=new Date();
  $("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(updateClock,1000);
updateClock();

function selectType(type){
  selectedType=type;
  $("lendBtn").classList.toggle("active",type==="lend");
  $("repayBtn").classList.toggle("active",type==="repay");
  $("otherBtn").classList.toggle("active",type==="other");
}

function addCustomer(){
  var name=prompt("请输入客户姓名");
  if(name===null)return;
  name=name.trim();
  if(!name){showToast("客户姓名不能为空");return;}
  if(state.names.indexOf(name)===-1) state.names.unshift(name);
  state.names=state.names.slice(0,50);
  saveData();
  chooseName(name);
  showToast("已选择："+name);
}

function chooseName(name){
  $("customerInput").value=name;
  var buttons=document.querySelectorAll(".name-btn");
  buttons.forEach(function(b){b.classList.remove("active");});
  buttons.forEach(function(b){
    if(b.getAttribute("data-name")===name)b.classList.add("active");
  });
  $("amount").focus();
}

function deleteCustomer(name){
  if(!confirm("确定删除客户“"+name+"”吗？\\n\\n只删除客户按钮，不删除任何历史流水。"))return;
  state.names=state.names.filter(function(n){return n!==name;});
  if($("customerInput").value.trim()===name)$("customerInput").value="";
  saveData();
  showToast("客户已删除，历史流水保留");
}

function nowTime(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}

function saveFlow(){
  if(viewDate!==state.currentDate){
    showToast("正在查看历史账单，请先回到当前账单");
    return;
  }

  var customer=$("customerInput").value.trim();
  var amount=Number($("amount").value);

  if(!customer){
    showToast("请先输入或选择客户");
    $("customerInput").focus();
    return;
  }
  if(!Number.isFinite(amount) || amount<=0){
    showToast("请输入正确金额");
    $("amount").focus();
    return;
  }

  var f={
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    customer:customer,
    amount:amount,
    type:selectedType,
    note:$("note").value.trim(),
    time:nowTime()
  };

  day(viewDate).flows.push(f);

  if(state.names.indexOf(customer)===-1)state.names.unshift(customer);
  state.names=state.names.slice(0,50);

  $("amount").value="";
  $("note").value="";
  saveData();
  showToast("保存成功");
}

function addCapital(){
  if(viewDate!==state.currentDate){showToast("历史账单不能修改本金");return;}
  var amount=Number($("capitalAmount").value);
  if(!Number.isFinite(amount)||amount<=0){showToast("请输入本金金额");return;}
  day(viewDate).capital+=amount;
  $("capitalAmount").value="";
  $("capitalNote").value="";
  saveData();
  showToast("本金已加入");
}

function resetCapital(){
  if(viewDate!==state.currentDate){showToast("历史账单不能修改本金");return;}
  var current=day(viewDate).capital;
  var v=prompt("请输入本日带入本金金额",String(current||0));
  if(v===null)return;
  var amount=Number(v);
  if(!Number.isFinite(amount)||amount<0){showToast("金额不正确");return;}
  day(viewDate).capital=amount;
  saveData();
  showToast("本金已重新设置");
}

function deleteFlow(id){
  var d=day(viewDate);
  var index=d.flows.findIndex(function(f){return f.id===id;});
  if(index<0)return;
  var f=d.flows[index];
  var label=f.type==="lend"?"借出":f.type==="repay"?"还款":"其他收入";
  var text="确定删除这笔流水吗？\\n\\n客户："+f.customer+"\\n类型："+label+"\\n金额："+money(f.amount)+"\\n时间："+f.time;
  if(!confirm(text))return;
  deletedRecord={date:viewDate,item:d.flows.splice(index,1)[0]};
  saveData();
  showToast("已删除，可以撤销");
}

function undoDelete(){
  if(!deletedRecord){showToast("没有可以撤销的记录");return;}
  day(deletedRecord.date).flows.push(deletedRecord.item);
  deletedRecord=null;
  saveData();
  showToast("已恢复");
}

function clearDay(){
  var d=day(viewDate);
  if(d.flows.length===0){showToast("本日没有流水");return;}
  if(!confirm("确定清空"+formatDate(viewDate)+"全部流水吗？\\n\\n其他日期流水、客户名单和客户累计余额不会被删除。\\n如果只是换到明天，请使用“开始新一天”。"))return;
  d.flows=[];
  saveData();
  showToast("本日流水已清空");
}

function startNewDay(){
  if(viewDate!==state.currentDate){
    viewDate=state.currentDate;
    render();
  }

  var real=todayKey();

  if(real!==state.currentDate){
    state.currentDate=real;
    day(real);
    viewDate=real;
    saveData();
    showToast("已进入"+formatDate(real));
    return;
  }

  var d=new Date();
  d.setDate(d.getDate()+1);
  var next=dateKey(d);

  if(!confirm("确定结束"+formatDate(state.currentDate)+"并开始"+formatDate(next)+"吗？\\n\\n今天所有流水会自动保存到历史账单，不会删除。"))return;

  state.currentDate=next;
  day(next);
  viewDate=next;
  saveData();
  window.scrollTo({top:0,behavior:"smooth"});
  showToast("已开始"+formatDate(next));
}

function viewHistory(date){
  viewDate=date;
  $("search").value="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function backToCurrent(){
  viewDate=state.currentDate;
  $("search").value="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function allFlows(){
  var result=[];
  Object.keys(state.days).forEach(function(date){
    state.days[date].flows.forEach(function(f){result.push(f);});
  });
  return result;
}

function renderReport(){
  var map={};
  allFlows().forEach(function(f){
    if(!map[f.customer])map[f.customer]={lend:0,repay:0};
    if(f.type==="lend")map[f.customer].lend+=Number(f.amount);
    if(f.type==="repay")map[f.customer].repay+=Number(f.amount);
  });

  var names=Object.keys(map).sort(function(a,b){
    return (map[b].lend-map[b].repay)-(map[a].lend-map[a].repay);
  });

  if(names.length===0){
    $("report").innerHTML='<div class="empty">还没有客户流水</div>';
    return;
  }

  var html="";
  names.forEach(function(name){
    var x=map[name];
    var debt=x.lend-x.repay;
    html+='<div class="customer" style="margin-top:9px">'+
      '<div class="customer-head"><b>'+esc(name)+'</b><span>当前待还 '+money(debt)+'</span></div>'+
      '<div class="history-summary" style="padding:8px;margin:0">'+
      '<div><small>累计借出</small><b>'+money(x.lend)+'</b></div>'+
      '<div><small>累计回款</small><b>'+money(x.repay)+'</b></div>'+
      '<div><small>当前待还</small><b>'+money(debt)+'</b></div>'+
      '<div><small>流水</small><b>'+countCustomer(name)+'</b></div>'+
      '</div></div>';
  });
  $("report").innerHTML=html;
}

function countCustomer(name){
  return allFlows().filter(function(f){return f.customer===name;}).length;
}

function renderLedger(){
  var d=day(viewDate);
  var q=$("search").value.trim().toLowerCase();
  var flows=d.flows.filter(function(f){
    return !q || (String(f.customer)+" "+String(f.note)+" "+String(f.amount)).toLowerCase().indexOf(q)>=0;
  });

  var groups={};
  flows.forEach(function(f){
    if(!groups[f.customer])groups[f.customer]=[];
    groups[f.customer].push(f);
  });

  var html="";
  Object.keys(groups).forEach(function(customer){
    var list=groups[customer];
    var balance=0;
    list.forEach(function(f){
      if(f.type==="lend")balance+=Number(f.amount);
      if(f.type==="repay")balance-=Number(f.amount);
    });

    html+='<div class="customer"><div class="customer-head"><b>'+esc(customer)+'</b><span>本日'+(balance>=0?"欠款 ":"结余 ")+money(Math.abs(balance))+'</span></div>';

    list.slice().sort(function(a,b){return String(b.time).localeCompare(String(a.time));}).forEach(function(f){
      var label=f.type==="lend"?"借出":f.type==="repay"?"还款":"其他收入";
      var sign=f.type==="lend"?"-":"+";
      html+='<div class="flow">'+
        '<span class="badge '+f.type+'">'+label+'</span>'+
        '<div><div class="flow-note">'+esc(f.note||"无备注")+'</div><div class="flow-time">'+esc(f.time)+'</div></div>'+
        '<div class="amount '+f.type+'">'+sign+money(f.amount).slice(1)+'</div>'+
        '<button class="del" onclick="deleteFlow(\\''+escJs(f.id)+'\\')">⌫</button>'+
        '</div>';
    });

    html+='<div style="padding:8px 12px;text-align:right;border-top:1px solid var(--line);font-size:12px;color:#667180">本客户本日'+(balance>=0?"欠款 ":"结余 ")+money(Math.abs(balance))+'</div></div>';
  });

  if(!html)html='<div class="empty">'+formatDate(viewDate)+'还没有流水<br>输入客户和金额后保存即可</div>';
  $("ledger").innerHTML=html;
}

function summary(d){
  var a={lend:0,repay:0,other:0,count:d.flows.length};
  d.flows.forEach(function(f){
    if(f.type==="lend")a.lend+=Number(f.amount);
    else if(f.type==="repay")a.repay+=Number(f.amount);
    else a.other+=Number(f.amount);
  });
  return a;
}

function renderHistory(){
  var dates=Object.keys(state.days).sort().reverse();
  if(!dates.length){$("history").innerHTML='<div class="empty">还没有历史账单</div>';return;}

  var html="";
  dates.forEach(function(date){
    var s=summary(state.days[date]);
    var current=date===state.currentDate;
    var viewing=date===viewDate;
    html+='<div class="history-item">'+
      '<div class="history-head"><b>'+formatDate(date)+'</b><span>'+(current?"当前账单":viewing?"正在查看":"已保存")+'</span></div>'+
      '<div class="history-summary">'+
      '<div><small>借出</small><b>'+money(s.lend)+'</b></div>'+
      '<div><small>回款</small><b>'+money(s.repay)+'</b></div>'+
      '<div><small>其他</small><b>'+money(s.other)+'</b></div>'+
      '<div><small>笔数</small><b>'+s.count+'</b></div>'+
      '</div>'+
      '<div class="history-buttons"><button class="view" onclick="viewHistory(\\''+date+'\\')">'+(viewing?"正在查看":"查看流水")+'</button>'+
      (current?'<button onclick="showToast(\\'当前账单不能删除\\')">当前账单</button>':'<button onclick="deleteHistory(\\''+date+'\\')">删除这天</button>')+
      '</div></div>';
  });
  $("history").innerHTML=html;
}

function deleteHistory(date){
  var d=day(date);
  if(!confirm("确定删除"+formatDate(date)+"整天账单吗？\\n\\n共"+d.flows.length+"笔流水。\\n这个操作不可恢复。"))return;
  delete state.days[date];
  if(viewDate===date)viewDate=state.currentDate;
  saveData();
  showToast("历史账单已删除");
}

function render(){
  var current=viewDate===state.currentDate;
  $("dayTitle").textContent=(current?"当前账单：":"正在查看：")+formatDate(viewDate);
  $("newDayBtn").textContent=current?"＋ 开始新一天":"← 回到当前账单";
  $("newDayBtn").onclick=current?startNewDay:backToCurrent;
  $("entryCard").style.opacity=current?"1":"0.55";

  var d=day(viewDate);
  var s=summary(d);

  $("sumLend").textContent=money(s.lend);
  $("sumRepay").textContent=money(s.repay);
  $("sumOther").textContent=money(s.other);
  $("count").textContent=s.count;
  $("capitalIn").textContent=money(d.capital);
  $("capitalNow").textContent=money(d.capital-s.lend+s.repay+s.other);
  $("ledgerTitle").textContent=(current?"▤　本日流水":"▤　"+formatDate(viewDate)+"流水");

  $("nameList").innerHTML=state.names.slice(0,20).map(function(n){
    return '<div class="name-box"><button class="name-btn" data-name="'+esc(n)+'" onclick="chooseName(\\''+escJs(n)+'\\')">'+esc(n)+'</button><button class="name-del" onclick="deleteCustomer(\\''+escJs(n)+'\\')">×</button></div>';
  }).join("");

  renderReport();
  renderLedger();
  renderHistory();
}

function saveData(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){alert("浏览器保存数据失败，请不要清除浏览器网站数据。");}
  render();
}

function esc(s){
  return String(s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function escJs(s){
  return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\r/g,"\\r").replace(/\n/g,"\\n");
}

function goTop(){window.scrollTo({top:0,behavior:"smooth"});}

$("search").addEventListener("input",renderLedger);
$("customerInput").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();$("amount").focus();}
});
$("amount").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();saveFlow();}
});

// 如果重新打开网页时已经进入了真实的新日期：
// 自动准备新日期，但绝不删除旧日期。
(function syncRealDate(){
  var real=todayKey();
  if(real!==state.currentDate){
    state.currentDate=real;
    day(real);
    viewDate=real;
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  }
})();

render();
</script>
</body>
</html>
